<body>
<canvas id="c"></canvas>
<script>
// ===================== 基础设置 =====================
const W = 1100, H = 720, DPR = 2;
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');
cv.width = W * DPR; cv.height = H * DPR;
// ---- 像素风渲染：先画到低分辨率画布，再用“最近邻”放大，形成像素块 ----
const PS = 0.4;                                   // 像素密度：1 个像素块 = 2.5 个逻辑像素
const LO = document.createElement('canvas'); LO.width = Math.round(W * PS); LO.height = Math.round(H * PS);
const LOC = LO.getContext('2d', { willReadFrequently: true });
const TX = document.createElement('canvas'); TX.width = W; TX.height = H;  // 文字层：分辨率高一点保证看得清
const TXC = TX.getContext('2d');
let ctx = MAIN;
let PIXEL = false; // 像素风开关（目前关闭，用原来的画风）
function fit() { const s = Math.min(innerWidth / W, innerHeight / H) * 0.98; cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const FONT = '"Microsoft YaHei","PingFang SC",sans-serif';
const TFONT = '"ZCOOL KuaiLe","Microsoft YaHei","PingFang SC",sans-serif';
try { document.fonts && document.fonts.load('40px "ZCOOL KuaiLe"', '烤冷面小摊开始游戏说明返回继续重玩过关时间到暂停中东北街头铁板现烤下一关回到首页全部通关再试一次'); } catch (_) {}
const OL = '#3b2418'; // 卡通描边色

// ===================== 游戏参数 =====================
// 颜色四段：浅色(生) → 中间色 → 深色(熟了) → 焦黑(烤过头，扔掉重做)
const READY = { noodle: 6, sausage: 9, fish: 11, egg: 3 };
const BURN = { noodle: 13, sausage: 18, fish: 20 };
const COLORS = {
  noodle:  [[240, 234, 212], [228, 198, 138], [192, 134, 62], [62, 42, 30]],
  sausage: [[242, 165, 165], [208, 98, 76],   [140, 44, 30],  [50, 24, 20]],
  fish:    [[242, 232, 206], [228, 182, 104], [176, 106, 38], [64, 42, 24]],
};
const PRICE = [8, 11, 12, 15];
const ORDER_NAME = ['普通烤冷面', '加香肠', '加鱼排', '香肠+鱼排'];
const ORDER_TOP = [[0, 0], [1, 0], [0, 1], [1, 1]];
const LEVELS = [
  { name: '新手上路',   desc: '只做普通烤冷面',   time: 180, target: 30,  patience: 120, types: [0],          meat: [],                  spawn: [24, 32], maxCust: 2, firstSpawn: 3, intro: '第一关：先学做普通烤冷面' },
  { name: '加根香肠',   desc: '新增香肠',         time: 180, target: 50,  patience: 90,  types: [0, 1, 1],    meat: ['sausage'],         spawn: [14, 20], maxCust: 2, intro: '第二关：新增香肠！' },
  { name: '全都要',     desc: '香肠 + 鱼排',      time: 190, target: 80,  patience: 75,  types: [0, 1, 2, 3], meat: ['sausage', 'fish'], spawn: [10, 15], intro: '第三关：新增鱼排！' },
  { name: '挑剔的客人', desc: '有的客人不要香菜', time: 200, target: 100, patience: 70,  types: [0, 1, 2, 3], meat: ['sausage', 'fish'], spawn: [10, 14], noCil: 0.4,  intro: '第四关：有的客人不要香菜，看清订单！' },
  { name: '夜市高峰',   desc: '客人又多又急',     time: 210, target: 140, patience: 58,  types: [1, 2, 3, 3], meat: ['sausage', 'fish'], spawn: [7, 11],  noCil: 0.45, intro: '第五关：夜市高峰，客人又多又急！' },
];

const NAMES = { noodle: '冷面', vinegar: '醋', egg: '鸡蛋', brush: '酱', cilantro: '香菜', sausage: '香肠', fish: '鱼排',
  bowl: '纸碗', spatula: '铲子', trash: '垃圾桶' };
const SHELF = ['noodle', 'vinegar', 'egg', 'brush', 'cilantro', 'sausage', 'fish', 'bowl'];
const STATIONS = SHELF.map((id, i) => ({ id, x: 30 + i * 122, y: 300, w: 110, h: 88 }));
STATIONS.push({ id: 'spatula', x: 10, y: 400, w: 86, h: 312 }, { id: 'trash', x: 1012, y: 590, w: 80, h: 122 });
const KEY_ORDER = ['noodle', 'vinegar', 'egg', 'spatula', 'brush', 'cilantro', 'sausage', 'fish', 'bowl'];
const KEYS = '123456789';

const NSLOTS = [{ x: 104, y: 398, w: 300, h: 314 }, { x: 406, y: 398, w: 300, h: 314 }];
const GSLOTS = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 2; c++) GSLOTS.push({ x: 728 + c * 138, y: 420 + r * 146, w: 132, h: 140 });
const CSLOTS = [154, 522, 890];
const PSLOTS = [{ x: 1014, y: 420, w: 76, h: 80 }, { x: 1014, y: 504, w: 76, h: 80 }]; // 保温盘的两个位置
const RESTART = { x: 1010, y: 7, w: 80, h: 28 };
const PAUSE = { x: 922, y: 7, w: 80, h: 28 };

const SKINS = ['#fbe0c8', '#f3cfae', '#e9b98f', '#d9a074', '#f7d6bd', '#c88a5e'];
const HAIRS = ['#2b2220', '#4a2f22', '#7a4a2a', '#26283f', '#b98a4a', '#8b2f3a', '#5c4033'];
const SHIRTS = ['#e8615a', '#5b8fe0', '#5fbf7a', '#f3a83b', '#9b78e0', '#ea7ab4', '#3fb7b0', '#f4d35e'];
const CAPS = ['#e8615a', '#2f6fd6', '#2b2b2b', '#f3a83b'];
// 动物客人
const AOL = '#5e4033';
const AN = {
  bunny:   { body: '#fffdf8', item: 'bag' },
  cat:     { body: '#fffaf2', item: 'boba' },
  penguin: { body: '#4b505c', belly: '#fffdf8', item: 'cup' },
  dino:    { body: '#a8d08a', belly: '#f3efc6', item: 'chips' },
  bear:    { body: '#c8925e', belly: '#ecd0a8', item: 'bag' },
  sheep:   { body: '#fffdf8', item: 'heart' },
};
const ANIMALS = Object.keys(AN);
// 每道工序在铁板上能放多久，超过就焦（加了酱、配料也一样会焦）
const LIMIT = { flipped: 12, egg: 12, eggdown: 15, folded: 12, cut: 10 };

// ===================== 工具函数 =====================
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const inR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
function step(kind, t) {
  if (BURN[kind] && t >= BURN[kind]) return 3;
  return t >= READY[kind] ? 2 : t >= READY[kind] / 2 ? 1 : 0;
}
const nearBurn = (kind, t) => step(kind, t) === 2 && t > BURN[kind] - 3;
const kcol = (kind, t) => rgb(COLORS[kind][step(kind, t)]);
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255];
  return rgb(c.map(v => clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255)));
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, col, align = 'center', weight = 'bold', stroke, fam = FONT) {
  if (ctx === LOC) { // 像素模式：文字画到文字层，保留当前的位移/缩放
    const m = LOC.getTransform(), k = 1 / PS;
    TXC.setTransform(m.a * k, m.b * k, m.c * k, m.d * k, m.e * k, m.f * k); TXC.globalAlpha = LOC.globalAlpha;
    const c0 = ctx; ctx = TXC; text(s, x, y, size, col, align, weight, stroke ? stroke : null, fam); ctx = c0; return;
  }
  ctx.font = `${weight} ${size}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(3, size / 7); ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
// 固定随机数（背景楼房用）
let seed = 7; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ===================== 状态 =====================
let S = { mode: 'home', level: 0 };
let mouse = { x: 0, y: 0 };
let buttons = [];
let clock = 0;

function makeLook(kind) { return { kind: kind || pick(ANIMALS), blinkT: rand(0, 4) }; }
const HOME_CUST = ['bunny', 'cat', 'bear'].map(k => makeLook(k));

function startLevel(i) {
  S = { mode: 'play', level: i, time: LEVELS[i].time, money: 0, noodles: [null, null], grill: [null, null, null, null],
    cust: [null, null, null], plate: [null, null], spawnT: LEVELS[i].firstSpawn || 2, tool: null, held: null, floats: [], swipe: null,
    served: 0, lost: 0, smoke: [], paused: false };
  say(W / 2, 200, LEVELS[i].intro, '#fff');
}
const goHome = () => { S = { mode: 'home', level: 0 }; };
function newNoodle() {
  const leaves = [];
  for (let k = 0; k < 16; k++) leaves.push([rand(-90, 90), rand(-62, 62), rand(0, Math.PI)]);
  return { stage: 'raw', t: 0, vinegar: false, eggT: 0, sauce: false, cil: false, sausage: null, fish: null,
    cuts: [], defects: [], anim: 0, fold: 0, heat: 0, burnt: false, leaves };
}
function say(x, y, s, col = '#fff') { S.floats.push({ x, y, s, col, t: 1.6 }); if (col === '#ffd36b') sfx('warn'); }
const meatOn = id => LEVELS[S.level].meat.includes(id);
function stationEnabled(id) { return !S.noodles || (id !== 'sausage' && id !== 'fish') || meatOn(id); }

// ===================== 声音（Web Audio 实时合成，不需要音频文件） =====================
const AU = (() => {
  let ac = null, master, bgmBus, sfxBus, hiss, hissGain, noiseBuf;
  let muted = false; try { muted = localStorage.getItem('klm_mute') === '1'; } catch (_) {}
  let nextT = 0, stepI = 0, timer = null;
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    ac = new C();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.9;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    bgmBus = ac.createGain(); bgmBus.gain.value = 0.16; bgmBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 铁板上一直在响的“滋滋”底噪
    hiss = ac.createBufferSource(); hiss.buffer = noiseBuf; hiss.loop = true;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3800;
    const pk = ac.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 7000; pk.gain.value = 6;
    hissGain = ac.createGain(); hissGain.gain.value = 0;
    hiss.connect(hp); hp.connect(pk); pk.connect(hissGain); hissGain.connect(sfxBus); hiss.start();
    nextT = ac.currentTime + 0.1; timer = setInterval(schedule, 25);
  }
  const now = () => ac.currentTime;
  function env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); }
  function tone(freq, t, dur, { type = 'sine', vol = 0.3, a = 0.005, slide = 0, bus = sfxBus, lp = 0 } = {}) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    let last = o; if (lp) { const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp; o.connect(f); last = f; }
    last.connect(g); g.connect(bus); env(g, t, a, vol, dur); o.start(t); o.stop(t + a + dur + 0.05);
  }
  function noise(t, dur, { type = 'bandpass', f = 3000, f2 = 0, q = 1, vol = 0.3, a = 0.005, bus = sfxBus } = {}) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ac.createGain(); s.connect(fl); fl.connect(g); g.connect(bus); env(g, t, a, vol, dur);
    s.start(t, Math.random() * 1.5); s.stop(t + a + dur + 0.05);
  }
  const crackle = (t, vol) => noise(t, 0.012 + Math.random() * 0.02, { type: 'highpass', f: 2500 + Math.random() * 3000, vol, a: 0.001 });
  // 一阵“滋啦——”：嘶嘶声 + 噼里啪啦的油花
  function sizzle(t, dur, vol) {
    noise(t, dur, { type: 'highpass', f: 5200, f2: 3600, vol: vol * 0.55, a: 0.02 });
    noise(t, dur * 0.7, { f: 6500, q: 0.8, vol: vol * 0.35, a: 0.01 });
    const n = Math.floor(dur * 45);
    for (let i = 0; i < n; i++) crackle(t + Math.random() * dur, vol * (0.25 + Math.random() * 0.6) * (1 - i / n * 0.5));
  }
  const S_ = {
    click() { tone(880, now(), 0.06, { type: 'triangle', vol: 0.18 }); tone(1320, now() + 0.03, 0.05, { type: 'triangle', vol: 0.1 }); },
    pick() { tone(520, now(), 0.07, { vol: 0.22, slide: 1.7 }); },
    warn() { const t = now(); tone(330, t, 0.07, { type: 'triangle', vol: 0.14 }); tone(262, t + 0.08, 0.09, { type: 'triangle', vol: 0.12 }); },
    plop() { const t = now(); tone(200, t, 0.12, { vol: 0.35, slide: 0.5 }); sizzle(t + 0.02, 0.6, 0.35); },
    vinegar() { // 醋泼到烫铁板上：猛的“刺啦——”
      const t = now(); noise(t, 0.09, { f: 1200, q: 2, vol: 0.15 }); // 倒醋的水声
      noise(t + 0.06, 1.4, { type: 'highpass', f: 9000, f2: 3000, vol: 0.7, a: 0.008 });
      sizzle(t + 0.06, 1.5, 0.8);
    },
    egg() { const t = now(); noise(t, 0.02, { f: 2500, q: 3, vol: 0.5, a: 0.001 }); noise(t + 0.05, 0.03, { f: 1800, q: 3, vol: 0.4, a: 0.001 });
      tone(160, t + 0.12, 0.1, { vol: 0.2, slide: 0.6 }); sizzle(t + 0.14, 1.0, 0.55); },
    flip() { const t = now(); noise(t, 0.16, { f: 700, f2: 3200, q: 1.2, vol: 0.3 }); tone(150, t + 0.14, 0.14, { vol: 0.45, slide: 0.45 });
      sizzle(t + 0.16, 0.9, 0.6); },
    fold() { const t = now(); noise(t, 0.12, { f: 900, f2: 2500, q: 1.2, vol: 0.22 }); tone(180, t + 0.1, 0.1, { vol: 0.3, slide: 0.5 });
      noise(t + 0.25, 0.12, { f: 900, f2: 2500, q: 1.2, vol: 0.22 }); tone(170, t + 0.35, 0.1, { vol: 0.3, slide: 0.5 }); sizzle(t + 0.36, 0.5, 0.35); },
    brush() { const t = now(); for (let i = 0; i < 3; i++) noise(t + i * 0.14, 0.12, { f: 1800, f2: 1100, q: 1.5, vol: 0.18, a: 0.03 }); sizzle(t + 0.1, 0.5, 0.25); },
    sprinkle() { const t = now(); for (let i = 0; i < 9; i++) noise(t + Math.random() * 0.35, 0.015, { f: 4000 + Math.random() * 2000, q: 4, vol: 0.2, a: 0.001 }); },
    place() { const t = now(); tone(240, t, 0.08, { vol: 0.3, slide: 0.6 }); sizzle(t + 0.03, 0.9, 0.55); },
    plate() { const t = now(); tone(1900, t, 0.25, { vol: 0.12 }); tone(2850, t, 0.18, { vol: 0.06 }); },
    cut() { const t = now(); noise(t, 0.1, { f: 3500, f2: 5000, q: 6, vol: 0.4 }); tone(1750, t + 0.06, 0.18, { type: 'triangle', vol: 0.12 }); },
    cutDone() { const t = now(); [784, 988, 1175].forEach((f, i) => tone(f, t + i * 0.07, 0.15, { type: 'triangle', vol: 0.15 })); },
    bowl() { const t = now(); noise(t, 0.14, { f: 600, q: 1, vol: 0.3 }); tone(320, t, 0.12, { type: 'triangle', vol: 0.15, slide: 0.8 }); },
    trash() { const t = now(); tone(110, t, 0.18, { vol: 0.5, slide: 0.6 }); noise(t, 0.25, { f: 400, q: 1, vol: 0.35 }); noise(t + 0.08, 0.05, { f: 2500, q: 2, vol: 0.15 }); },
    coin(big = true) { const t = now(); tone(1319, t, 0.08, { type: 'square', vol: 0.08, lp: 5000 }); tone(1760, t + 0.07, big ? 0.4 : 0.15, { type: 'square', vol: 0.08, lp: 5000 });
      if (big) { tone(2637, t + 0.07, 0.35, { vol: 0.07 }); } },
    happy() { const t = now() + 0.15; [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.06, 0.2, { type: 'triangle', vol: 0.12 })); },
    angry() { const t = now(); tone(220, t, 0.16, { type: 'sawtooth', vol: 0.16, lp: 900, slide: 0.85 }); tone(165, t + 0.2, 0.3, { type: 'sawtooth', vol: 0.16, lp: 800, slide: 0.8 }); },
    bell() { const t = now(); tone(1175, t, 0.6, { vol: 0.13 }); tone(1480, t + 0.12, 0.8, { vol: 0.12 }); tone(2350, t, 0.3, { vol: 0.04 }); },
    burn() { const t = now(); noise(t, 0.6, { type: 'lowpass', f: 900, f2: 300, vol: 0.35, a: 0.02 }); tone(520, t, 0.12, { type: 'square', vol: 0.07, lp: 2000 }); tone(520, t + 0.18, 0.12, { type: 'square', vol: 0.07, lp: 2000 }); },
    tick() { tone(1500, now(), 0.04, { type: 'square', vol: 0.06, lp: 3000 }); },
    win() { const t = now(); [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.13, 0.3, { type: 'triangle', vol: 0.2 }));
      [523, 659, 784, 1047].forEach(f => tone(f, t + 0.6, 0.9, { type: 'triangle', vol: 0.12 })); },
    lose() { const t = now(); [392, 330, 262, 196].forEach((f, i) => tone(f, t + i * 0.25, 0.35, { type: 'triangle', vol: 0.18 })); },
  };
  // ---- 背景音乐：五声音阶的小调，木鱼 + 沙锤 ----
  const _ = 0;
  const MEL = [72,74,76,79, 76,74,72,_, 74,76,79,81, 79,_,76,_,   72,74,76,79, 81,79,76,74, 72,74,69,_, 72,_,_,_,
               79,81,84,81, 79,76,79,_, 76,79,81,79, 76,74,72,_,   74,76,79,76, 74,72,69,72, 74,_,76,74, 72,_,_,_];
  const BASS = [48, 43, 45, 48, 41, 48, 43, 48];
  const STEP = 60 / 118 / 2; // 八分音符
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  function pluck(m, t, vol) { // 像古筝/琵琶的拨弦
    tone(midi(m), t, 0.38, { type: 'sawtooth', vol, a: 0.004, bus: bgmBus, lp: 2400 });
    tone(midi(m) * 2, t, 0.18, { vol: vol * 0.4, a: 0.003, bus: bgmBus });
  }
  function schedule() {
    if (!ac) return;
    const playing = (S.mode === 'play' && !S.paused) || S.mode === 'home' || S.mode === 'help' || S.mode === 'levels';
    bgmBus.gain.setTargetAtTime(S.paused ? 0.05 : S.mode === 'play' ? 0.12 : 0.16, ac.currentTime, 0.2);
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.15) {
      if (playing) {
        const i = stepI % MEL.length, bar = Math.floor(i / 8);
        if (MEL[i]) pluck(MEL[i], nextT, 0.22);
        if (i % 8 === 0) tone(midi(BASS[bar]), nextT, 0.5, { type: 'triangle', vol: 0.5, bus: bgmBus });
        if (i % 8 === 4) tone(midi(BASS[bar] + 7), nextT, 0.4, { type: 'triangle', vol: 0.4, bus: bgmBus });
        if (i % 4 === 2) tone(900, nextT, 0.05, { vol: 0.35, bus: bgmBus, slide: 0.7 });          // 木鱼
        noise(nextT, 0.04, { type: 'highpass', f: 7000, vol: i % 2 ? 0.06 : 0.12, a: 0.003, bus: bgmBus }); // 沙锤
        stepI++;
      }
      nextT += STEP;
    }
  }
  return {
    init, get muted() { return muted; },
    toggle() { muted = !muted; try { localStorage.setItem('klm_mute', muted ? '1' : '0'); } catch (_) {}
      if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.9, ac.currentTime, 0.05); },
    play(name, ...a) { if (ac && !muted && S_[name]) try { S_[name](...a); } catch (_) {} },
    // 每帧调用：根据铁板上有多少东西，调整滋滋声大小，并随机加油花爆裂声
    griddle(level, dt) {
      if (!ac) return;
      hissGain.gain.setTargetAtTime(level ? 0.05 + 0.035 * Math.min(level, 6) : 0, ac.currentTime, 0.15);
      if (!muted && level && Math.random() < dt * level * 9) crackle(ac.currentTime + 0.01, 0.05 + Math.random() * 0.12);
    },
  };
})();
const sfx = (n, ...a) => AU.play(n, ...a);
const SOUND = { x: 834, y: 7, w: 80, h: 28 };      // 游戏中音量按钮
const SOUND_MENU = { x: 1010, y: 7, w: 80, h: 28 }; // 首页等界面的音量按钮
addEventListener('pointerdown', () => AU.init(), true);
addEventListener('keydown', () => AU.init(), true);

// ===================== 交互逻辑 =====================
function useOnNoodle(i, tool) {
  const sl = NSLOTS[i], cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2;
  const n = S.noodles[i];
  const msg = (s, c = '#ffd36b') => say(cx, cy - 30, s, c);
  if (!tool) return msg('先从上面架子上拿食材');
  if (tool === 'trash') { if (n) { S.noodles[i] = null; sfx('trash'); msg('扔掉了', '#ddd'); } return; }
  if (!n) { if (tool === 'noodle') { S.noodles[i] = newNoodle(); sfx('plop'); msg('放上冷面', '#fff'); } else msg('先放冷面'); return; }
  if (n.burnt && !(tool === 'bowl' && n.stage === 'cut')) return msg('烤焦了！点它拿起来，扔进垃圾桶', '#ff8a7a');
  switch (tool) {
    case 'noodle': msg('这里已经有冷面了'); break;
    case 'vinegar':
      if (n.stage === 'raw' && step('noodle', n.t) === 3) return msg('已经焦了，扔掉重做吧', '#ff8a7a');
      if (n.stage === 'raw' && !n.vinegar) { n.vinegar = true; sfx('vinegar'); msg('滋啦~ 加醋', '#bdf'); }
      else msg(n.stage === 'raw' ? '已经加过醋了' : '现在不用加醋');
      break;
    case 'spatula':
      if (n.stage === 'raw') {
        const s = step('noodle', n.t);
        if (s === 3) return msg('烤焦了！用垃圾桶扔掉重做', '#ff8a7a');
        if (!n.vinegar) return msg('先加醋!');
        if (s < 2) return msg('颜色还不够深，再等等');
        n.stage = 'flipped'; n.anim = 1; n.heat = 0; sfx('flip'); msg('翻面!', '#fff');
      } else if (n.stage === 'flipped') msg('先打鸡蛋');
      else if (n.stage === 'egg') {
        if (n.eggT < READY.egg) return msg('鸡蛋还没凝固');
        n.stage = 'eggdown'; n.anim = 1; n.heat = 0; sfx('flip'); msg('翻过来把蛋压下面!', '#fff');
      } else if (n.stage === 'eggdown') {
        if (!n.sauce) return msg('先刷酱');
        if (!n.cil && !LEVELS[S.level].noCil) return msg('先撒香菜');
        n.stage = 'folded'; n.fold = 1; n.heat = 0; sfx('fold'); msg('两边折起来!', '#fff');
      } else if (n.stage === 'folded') msg('按住鼠标，用铲子横着划过冷面');
      else msg('拿纸碗装起来');
      break;
    case 'egg':
      if (n.stage === 'flipped') { n.stage = 'egg'; n.eggT = 0; n.heat = 0; sfx('egg'); msg('打个鸡蛋', '#fff'); }
      else msg(n.stage === 'raw' ? '先翻面再打蛋' : '已经有蛋了');
      break;
    case 'brush':
      if (n.stage === 'eggdown' && !n.sauce) { n.sauce = true; sfx('brush'); msg('刷酱~', '#fff'); }
      else msg(n.stage === 'eggdown' ? '已经刷过了' : '现在还不能刷酱');
      break;
    case 'cilantro':
      if (n.stage === 'eggdown' && n.sauce && !n.cil) { n.cil = true; sfx('sprinkle'); msg('撒香菜', '#9f9'); }
      else if (n.stage === 'eggdown' && !n.sauce) msg('先刷酱');
      else msg(n.cil ? '已经撒过了' : '现在还不能撒香菜');
      break;
    case 'sausage': case 'fish':
      msg('先放到右边烤架烤熟，再夹过来'); break;
    case 'bowl':
      if (n.stage === 'cut') {
        S.held = { kind: 'bowl', b: { s: !!n.sausage, f: !!n.fish, cil: n.cil, burnt: n.burnt,
          defects: n.defects.concat(n.burnt ? ['冷面焦了'] : []) } };
        S.tool = null; S.noodles[i] = null; sfx('bowl'); msg('装碗！点客人交餐', '#fff');
      } else msg('还没切好');
      break;
  }
}

// 手里夹着的肉：可能来自烤架，也可能来自保温盘
const meatArr = () => S.held.src === 'plate' ? S.plate : S.grill;
const heldMeat = () => S.held && S.held.kind === 'meat' ? meatArr()[S.held.slot] : null;

function placeMeat(i) {
  const g = heldMeat(), n = S.noodles[i];
  const sl = NSLOTS[i], cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2;
  if (!g) { S.held = null; return; }
  const st = step(g.type, g.t), nm = NAMES[g.type];
  if (n && n.burnt) return say(cx, cy - 30, '冷面焦了！先扔掉重做', '#ff8a7a');
  if (!n || n.stage !== 'eggdown' || !n.sauce) return say(cx, cy - 30, '刷完酱再放香肠/鱼排', '#ffd36b');
  if (n[g.type]) return say(cx, cy - 30, '已经放过了', '#ffd36b');
  if (st < 2) n.defects.push(nm + '没熟');
  if (st === 3) n.defects.push(nm + '焦了');
  n[g.type] = { t: g.t };
  meatArr()[S.held.slot] = null; S.held = null; sfx('place');
  say(cx, cy - 30, st === 2 ? '放上' + nm : st === 3 ? nm + '焦了…客人不会给钱' : nm + '还是生的…只能收 2 块', st === 2 ? '#fff' : '#ff9a7a');
}

function usePlate(k) {
  const sl = PSLOTS[k], m = S.plate[k], cx = sl.x + sl.w / 2 - 40, cy = sl.y + sl.h / 2;
  if (!LEVELS[S.level].meat.length) return say(cx, cy, '第二关开放', '#ffd36b');
  if (S.held && S.held.kind === 'meat') {
    if (S.held.src === 'plate' && S.held.slot === k) { S.held = null; return; }
    if (m) return say(cx, cy, '这格已经有了', '#ffd36b');
    const it = heldMeat(); meatArr()[S.held.slot] = null; S.plate[k] = it; S.held = null; sfx('plate');
    say(cx, cy - 20, '放进保温盘，不会焦', '#fff'); return;
  }
  if (m) { S.held = { kind: 'meat', src: 'plate', slot: k }; S.tool = null; sfx('pick'); return; }
  say(cx, cy, '烤好的肉放这里不会焦', '#ffd36b');
}

function useOnGrill(j, tool) {
  const sl = GSLOTS[j], g = S.grill[j], cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2;
  if (!LEVELS[S.level].meat.length) return say(cx, cy - 20, '第二关才开始烤香肠', '#ffd36b');
  if (S.held && S.held.kind === 'meat') {
    if ((S.held.src === 'grill' && S.held.slot === j) || g) { S.held = null; return; }
    const it = heldMeat(); meatArr()[S.held.slot] = null; S.grill[j] = it; S.held = null; sfx('place'); return;
  }
  if (tool === 'trash') { if (g) { S.grill[j] = null; sfx('trash'); say(cx, cy - 20, '扔掉了', '#ddd'); } return; }
  if (g) { S.held = { kind: 'meat', src: 'grill', slot: j }; sfx('pick'); return; }
  if (tool === 'sausage' || tool === 'fish') { S.grill[j] = { type: tool, t: 0 }; sfx('place'); say(cx, cy - 20, '烤' + NAMES[tool], '#fff'); }
  else say(cx, cy - 20, '这里烤香肠/鱼排', '#ffd36b');
}

function serve(ci) {
  const c = S.cust[ci], b = S.held.b;
  if (!c || c.state !== 'wait') return;
  const [ws, wf] = ORDER_TOP[c.type];
  S.held = null;
  const reject = line => { sfx('angry'); talk(c, line, 'angry'); S.lost++; say(c.x, 150, '¥0', '#ff8a7a'); };
  if (!!ws !== b.s || !!wf !== b.f) return reject(pick(['这不是我点的！', '我点的不是这个呀！', '你搞错了吧！']));
  if (c.noCil && b.cil !== false) return reject(pick(['我说了不要香菜！', '怎么放香菜了！我不吃这个！']));
  if (!c.noCil && b.cil === false) return reject(pick(['怎么没放香菜？', '香菜呢？少放东西了！']));
  const burnt = b.defects.filter(d => d.includes('焦')), raw = b.defects.filter(d => d.includes('没熟'));
  if (burnt.length || raw.length) {
    // 焦了：一分不给；没熟：只给 2 块
    const pay = burnt.length ? 0 : 2;
    S.money += pay; S.served++; if (pay) sfx('coin', false); sfx('angry');
    say(c.x, 150, burnt.length ? '¥0（焦了不给钱）' : '+¥2（没熟）', '#ff8a7a');
    const lines = (burnt.length ? burnt : raw).flatMap(d => COMPLAIN[d] || []);
    talk(c, pick(lines.length ? lines : COMPLAIN.generic), 'angry');
  } else {
    const tip = Math.ceil(3 * c.p / c.pmax);
    const pay = PRICE[c.type] + tip;
    S.money += pay; S.served++; sfx('coin'); sfx('happy');
    say(c.x, 150, '+¥' + pay, '#7dff8a');
    talk(c, pick(['真香！', '太好吃了！', '下次还来！', '绝了！', '老板手艺真好！']), 'happy');
  }
  if (S.money >= LEVELS[S.level].target) { S.mode = 'win'; setTimeout(() => sfx('win'), 500); }
}

const COMPLAIN = {
  '香肠没熟': ['香肠还是生的！怎么吃啊！', '这香肠没烤熟！差评！', '生香肠？吃坏肚子怎么办！'],
  '鱼排没熟': ['鱼排是生的！太过分了！', '鱼排没烤熟，难吃！', '生鱼排？哼，下次不来了！'],
  '香肠焦了': ['香肠都烤成炭了！不给钱！', '这香肠黑乎乎的，怎么吃！'],
  '鱼排焦了': ['鱼排焦成这样还卖？', '一股糊味！不给钱！'],
  '冷面焦了': ['冷面都糊了！不给钱！', '这烤冷面黑成炭了！'],
  generic: ['这也太难吃了吧…', '哼，差评！', '做的什么呀！'],
};
// 客人说一句话，然后离开
function talk(c, line, mood) { c.state = 'leave'; c.mood = mood; c.say = line; c.react = 1.8; }

function spawnCustomer() {
  const L = LEVELS[S.level];
  const free = [0, 1, 2].filter(i => !S.cust[i]);
  if (!free.length || 3 - free.length >= (L.maxCust || 3)) return;
  const i = pick(free);
  S.cust[i] = Object.assign(makeLook(), { slot: i, type: pick(L.types), noCil: Math.random() < (L.noCil || 0), p: L.patience, pmax: L.patience,
    x: W + 90, dir: -1, state: 'walk', mood: 'happy', bob: Math.random() * 6 }); // 都从右边进场往左走，离开时继续往左走
  sfx('bell');
}

// ===================== 输入 =====================
function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointermove', e => { mouse = pos(e); if (S.swipe) S.swipe.pts.push(mouse); });
cv.addEventListener('pointerdown', e => {
  const p = pos(e); mouse = p;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const hitButtons = () => { for (const b of buttons) if (inR(p, b)) { sfx('click'); b.fn(); return true; } return false; };
  if (inR(p, S.mode === 'play' ? SOUND : SOUND_MENU)) { AU.toggle(); return; }
  if (S.mode !== 'play') { hitButtons(); return; }
  if (inR(p, RESTART)) { sfx('click'); startLevel(S.level); return; }
  if (inR(p, PAUSE)) { sfx('click'); S.paused = !S.paused; S.swipe = null; return; }
  if (S.paused) { hitButtons(); return; }
  const trash = STATIONS.find(s => s.id === 'trash');
  // 手里端着碗：只能交给客人，或者扔掉
  if (S.held && S.held.kind === 'bowl') {
    for (let i = 0; i < 3; i++) { const c = S.cust[i]; if (c && c.state === 'wait' && Math.abs(p.x - c.x) < 80 && p.y > 56 && p.y < 250) { serve(i); return; } }
    if (inR(p, trash)) { S.held = null; sfx('trash'); say(trash.x + trash.w / 2, trash.y, '扔掉了', '#ddd'); return; }
    say(p.x, p.y - 20, '点客人交餐（不要了就扔垃圾桶）', '#ffd36b'); return;
  }
  if (e.button === 2) { S.held = null; S.tool = null; return; }
  // 垃圾桶：把手里拿着的东西扔进去
  if (inR(p, trash)) {
    if (S.held && S.held.kind === 'meat') meatArr()[S.held.slot] = null;
    else if (S.held && S.held.kind === 'junk') S.noodles[S.held.i] = null;
    else { say(trash.x + trash.w / 2 - 40, trash.y - 10, '先点焦掉的东西拿起来', '#ffd36b'); return; }
    S.held = null; sfx('trash'); say(trash.x + trash.w / 2, trash.y - 10, '扔掉了', '#ddd'); return;
  }
  // 手里拿着焦冷面：只能扔
  if (S.held && S.held.kind === 'junk') { say(p.x, p.y - 20, '扔进右下角的垃圾桶', '#ffd36b'); return; }
  for (const st of STATIONS) if (inR(p, st)) {
    if (!stationEnabled(st.id)) { say(st.x + st.w / 2, st.y + 20, '后面的关卡才有', '#ffd36b'); return; }
    S.held = null; S.tool = S.tool === st.id ? null : st.id; sfx('pick'); return;
  }
  for (let k = 0; k < 2; k++) if (inR(p, PSLOTS[k])) { usePlate(k); return; }
  for (let j = 0; j < 4; j++) if (inR(p, GSLOTS[j])) { useOnGrill(j, S.tool); return; }
  for (let i = 0; i < 2; i++) if (inR(p, NSLOTS[i])) {
    if (S.held && S.held.kind === 'meat') { placeMeat(i); return; }
    if (S.noodles[i] && S.noodles[i].burnt && !(S.tool === 'bowl' && S.noodles[i].stage === 'cut')) { S.held = { kind: 'junk', i }; S.tool = null; sfx('pick'); return; }
    if (S.tool === 'spatula' && S.noodles[i] && S.noodles[i].stage === 'folded' && !S.noodles[i].burnt) { S.swipe = { i, pts: [p] }; return; }
    useOnNoodle(i, S.tool); return;
  }
  S.held = null;
});
cv.addEventListener('pointerup', () => {
  if (!S.swipe) return;
  const sw = S.swipe; S.swipe = null;
  const n = S.noodles[sw.i]; if (!n || n.stage !== 'folded' || n.burnt) return;
  const sl = NSLOTS[sw.i], cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2 + 8;
  const xs = sw.pts.map(q => q.x), ys = sw.pts.map(q => q.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const msg = s => say(cx, cy - 100, s, '#ffd36b');
  if (!(minX <= cx - 34 && maxX >= cx + 34)) return msg('按住鼠标，用铲子横着划过冷面!');
  if (Math.max(...ys) - Math.min(...ys) > 45) return msg('要横着切!');
  const inside = sw.pts.filter(q => Math.abs(q.x - cx) < 42);
  const y = (inside.length ? inside : sw.pts).reduce((a, q) => a + q.y, 0) / (inside.length || sw.pts.length) - cy;
  if (y < -80 + 14 || y > 80 - 14) return msg('切在冷面上');
  const last = n.cuts.length ? n.cuts[n.cuts.length - 1] : -999;
  if (y <= last + 16) return msg('从上往下切，留点间隔');
  n.cuts.push(y); sfx('cut');
  if (n.cuts.length >= 4) { n.stage = 'cut'; n.heat = 0; setTimeout(() => sfx('cutDone'), 150); say(cx, cy - 100, '切好了!', '#fff'); }
});
addEventListener('keydown', e => {
  if ((S.mode === 'help' || S.mode === 'levels') && e.key === 'Escape') { goHome(); return; }
  if (S.mode !== 'play') { if (e.key === 'Enter') buttons[0] && buttons[0].fn(); return; }
  if (e.key === 'm' || e.key === 'M') { AU.toggle(); return; }
  if (e.key === 'p' || e.key === 'P' || e.key === ' ') { e.preventDefault(); S.paused = !S.paused; S.swipe = null; return; }
  if (S.paused) return;
  if (S.held && S.held.kind === 'bowl') return;
  if (e.key === 'Escape') { S.held = null; S.tool = null; return; }
  const k = KEYS.indexOf(e.key);
  if (k >= 0 && stationEnabled(KEY_ORDER[k])) { S.tool = KEY_ORDER[k]; S.held = null; }
});

// ===================== 更新 =====================
function update(dt) {
  clock += dt;
  HOME_CUST.forEach(c => c.blinkT += dt);
  if (S.mode !== 'play' || S.paused) { AU.griddle(0, dt); return; }
  const L = LEVELS[S.level];
  const sec = Math.ceil(S.time);
  S.time -= dt;
  if (S.time <= 10 && Math.ceil(S.time) !== sec) sfx('tick');
  if (S.time <= 0) { S.time = 0; S.mode = 'lose'; AU.griddle(0, dt); sfx('lose'); return; }
  AU.griddle(S.noodles.filter(Boolean).length * 1.5 + S.grill.filter(Boolean).length, dt);
  for (const n of S.noodles) if (n) {
    n.anim = Math.max(0, n.anim - dt * 3); n.fold = Math.max(0, n.fold - dt * 2.5);
    if (n.burnt) continue;
    if (n.stage === 'raw') { n.t += dt; if (step('noodle', n.t) === 3) { n.burnt = true; sfx('burn'); } }
    else {
      n.heat += dt;                       // 不管加了什么，放在铁板上就一直在烤
      if (n.stage === 'egg') n.eggT += dt;
      if (n.heat >= LIMIT[n.stage]) { n.burnt = true; sfx('burn'); }
    }
  }
  for (const g of S.grill) if (g) { const b = step(g.type, g.t) === 3; g.t += dt; if (!b && step(g.type, g.t) === 3) sfx('burn'); }
  NSLOTS.forEach((sl, i) => { const n = S.noodles[i]; if (n && Math.random() < dt * (n.burnt ? 10 : 6))
    S.smoke.push({ x: sl.x + sl.w / 2 + rand(-80, 80), y: sl.y + sl.h / 2 + rand(-30, 30), t: 1, dark: n.burnt }); });
  GSLOTS.forEach((sl, j) => { const g = S.grill[j]; if (g && Math.random() < dt * 3)
    S.smoke.push({ x: sl.x + sl.w / 2 + rand(-30, 30), y: sl.y + sl.h / 2, t: 1, dark: step(g.type, g.t) === 3 }); });
  S.smoke.forEach(s => { s.t -= dt * 0.8; s.y -= dt * 30; s.x += Math.sin(s.t * 6) * 0.3; });
  S.smoke = S.smoke.filter(s => s.t > 0);
  for (let i = 0; i < 3; i++) {
    const c = S.cust[i]; if (!c) continue;
    c.bob += dt * 8; c.blinkT += dt;
    if (c.state === 'walk') { const tx = CSLOTS[i]; c.x += Math.sign(tx - c.x) * Math.min(Math.abs(tx - c.x), 260 * dt); if (Math.abs(tx - c.x) < 1) c.state = 'wait'; }
    else if (c.state === 'wait') {
      c.p -= dt;
      if (c.p <= 0) { sfx('angry'); talk(c, pick(['太慢了，不等了！', '等半天了，走了！', '哼，我去别家吃！']), 'angry'); S.lost++; }
    } else if (c.state === 'leave') {
      if (c.react > 0) c.react -= dt;          // 先站着说完话再走
      else { c.x += c.dir * 260 * dt; if (c.x < -160 || c.x > W + 160) S.cust[i] = null; }
    }
  }
  S.spawnT -= dt;
  // 店里没有客人（或客人都要走了）时，马上来新客人
  const active = S.cust.filter(c => c && c.state !== 'leave').length;
  if (active === 0 && S.spawnT > 1.5) S.spawnT = 1.5;
  if (S.spawnT <= 0) { spawnCustomer(); S.spawnT = rand(L.spawn[0], L.spawn[1]); }
  S.floats.forEach(f => { f.t -= dt; f.y -= dt * 28; });
  S.floats = S.floats.filter(f => f.t > 0);
  if (S.held && S.held.kind === 'meat' && !heldMeat()) S.held = null;
  if (S.held && S.held.kind === 'junk' && !S.noodles[S.held.i]) S.held = null;
}

// ===================== 绘制：食材 =====================
function drawSheet(cx, cy, w, h, col) {
  rr(cx - w / 2 + 3, cy - h / 2 + 5, w, h, 10); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  rr(cx - w / 2, cy - h / 2, w, h, 10); ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(60,30,10,.35)'; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5;
  for (let k = 1; k < 4; k++) { const yy = cy - h / 2 + h * k / 4; ctx.beginPath(); ctx.moveTo(cx - w / 2 + 8, yy); ctx.lineTo(cx + w / 2 - 8, yy); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.18)'; rr(cx - w / 2 + 8, cy - h / 2 + 6, w - 16, 8, 4); ctx.fill();
}
function drawSausage(x, y, len, th, col, vertical, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate((vertical ? Math.PI / 2 : 0) + rot);
  rr(-len / 2, -th / 2, len, th, th / 2); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = 'rgba(60,20,10,.45)'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 2;
  for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * len / 6 - 4, -th / 2 + 3); ctx.lineTo(k * len / 6 + 4, th / 2 - 3); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-len / 2 + th / 2, -th / 4); ctx.lineTo(len / 2 - th / 2, -th / 4); ctx.stroke(); ctx.lineCap = 'butt';
  ctx.restore();
}
function drawFish(x, y, w, h, col, vertical, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate((vertical ? Math.PI / 2 : 0) + rot);
  rr(-w / 2, -h / 2, w, h, 9); ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,10,.45)'; ctx.lineWidth = 1.8; ctx.stroke();
  ctx.fillStyle = 'rgba(90,50,10,.25)';
  for (let a = 0; a < 26; a++) { const px = ((a * 37) % 100) / 100 * (w - 12) - w / 2 + 6, py = ((a * 53) % 100) / 100 * (h - 10) - h / 2 + 5; ctx.fillRect(px, py, 3, 3); }
  ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(-w / 2 + 6, -h / 2 + 4, w - 12, 5, 3); ctx.fill();
  ctx.restore();
}
function drawEgg(cx, cy, w, h, t) {
  const s = step('egg', t);
  const white = ['rgba(255,250,235,.45)', 'rgba(255,250,240,.8)', '#fffaf0'][s];
  const yolk = ['rgba(255,200,40,.6)', 'rgba(252,200,50,.85)', '#f5bf33'][s];
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fillStyle = white; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 14, h / 2 - 12, 0, 0, Math.PI * 2); ctx.fillStyle = yolk; ctx.fill();
  if (s < 2) { ctx.beginPath(); ctx.ellipse(cx - 25, cy - 18, 18, 8, -0.3, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fill(); }
}
function drawSauce(cx, cy, w, h) {
  ctx.strokeStyle = 'rgba(122,52,22,.88)'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let r = 0; r < 3; r++) {
    ctx.beginPath(); const yy = cy - h / 3 + r * h / 3;
    for (let k = 0; k <= 8; k++) { const xx = cx - w / 2 + 16 + k * (w - 32) / 8; const y2 = yy + (k % 2 ? 7 : -7); k ? ctx.lineTo(xx, y2) : ctx.moveTo(xx, y2); }
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}
function drawLeaves(cx, cy, leaves, sx = 1) {
  for (const [lx, ly, a] of leaves) {
    ctx.save(); ctx.translate(cx + lx * sx, cy + ly); ctx.rotate(a);
    ctx.fillStyle = '#3f9b3a'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6fd162'; ctx.beginPath(); ctx.ellipse(4, 3, 4, 2.5, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawNoodle(n, sl) {
  const cx = sl.x + sl.w / 2, cy = sl.y + sl.h / 2 + 8, NW = 224, NH = 160;
  const done = rgb(COLORS.noodle[2]);
  ctx.save();
  const sy = n.anim > 0 ? Math.max(0.05, Math.abs(Math.cos((1 - n.anim) * Math.PI))) : 1;
  ctx.translate(cx, cy); ctx.scale(1, sy); ctx.translate(-cx, -cy);
  if (n.stage === 'raw') {
    drawSheet(cx, cy, NW, NH, kcol('noodle', n.t));
    if (n.vinegar && step('noodle', n.t) < 3) { ctx.fillStyle = 'rgba(255,255,255,.35)'; for (let k = 0; k < 7; k++) { ctx.beginPath(); ctx.ellipse(cx - 80 + k * 27, cy + ((k * 41) % 90) - 45, 9, 5, 0, 0, Math.PI * 2); ctx.fill(); } }
  } else if (n.stage === 'flipped' || n.stage === 'egg') {
    drawSheet(cx, cy, NW, NH, done);
    if (n.stage === 'egg') drawEgg(cx, cy, NW - 30, NH - 26, n.eggT);
  } else if (n.stage === 'eggdown') {
    rr(cx - NW / 2 - 6, cy - NH / 2 - 5, NW + 12, NH + 10, 14); ctx.fillStyle = '#f2c94c'; ctx.fill();
    drawSheet(cx, cy, NW, NH, done);
    if (n.sauce) drawSauce(cx, cy, NW, NH);
    if (n.cil) drawLeaves(cx, cy, n.leaves);
    if (n.sausage) drawSausage(cx - 20, cy, 128, 24, kcol('sausage', n.sausage.t), true);
    if (n.fish) drawFish(cx + 20, cy, 116, 36, kcol('fish', n.fish.t), true);
  } else {
    const fw = 84 + (NW - 84) * n.fold, fh = NH;
    const bounds = [-fh / 2].concat(n.cuts, [fh / 2]);
    rr(cx - fw / 2 + 3, cy - fh / 2 + 6, fw, fh, 8); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
    for (let k = 0; k < bounds.length - 1; k++) {
      const gap = n.stage === 'cut' ? 4 : 0;
      const y0 = cy + bounds[k] + (k ? gap / 2 : 0), y1 = cy + bounds[k + 1] - (k < bounds.length - 2 ? gap / 2 : 0);
      rr(cx - fw / 2 - 4, y0 - (k ? 0 : 3), fw + 8, y1 - y0 + (k ? 0 : 3) + (k === bounds.length - 2 ? 3 : 0), 8); ctx.fillStyle = '#f2c94c'; ctx.fill();
      rr(cx - fw / 2, y0, fw, y1 - y0, 8); ctx.fillStyle = done; ctx.fill();
      ctx.strokeStyle = 'rgba(60,30,10,.3)'; ctx.lineWidth = 1.5; ctx.stroke();
      if (gap) {
        ctx.fillStyle = '#f2c94c'; ctx.fillRect(cx - fw / 2 + 6, y1 - 3, fw - 12, 3);
        if (n.sausage) { ctx.fillStyle = '#c0573f'; ctx.beginPath(); ctx.arc(cx - 12, y1 - 2, 6, Math.PI, 0); ctx.fill(); }
        if (n.fish) { ctx.fillStyle = '#e0b060'; ctx.fillRect(cx + 4, y1 - 5, 18, 5); }
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - fw / 2 + 10, cy - fh / 2 + 6); ctx.lineTo(cx - fw / 2 + 10, cy + fh / 2 - 6);
    ctx.moveTo(cx + fw / 2 - 10, cy - fh / 2 + 6); ctx.lineTo(cx + fw / 2 - 10, cy + fh / 2 - 6); ctx.stroke();
    ctx.strokeStyle = 'rgba(122,52,22,.8)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath(); for (let k = 0; k < 6; k++) { const yy = cy - fh / 2 + 14 + k * 26; ctx.moveTo(cx - fw / 2 + 16, yy); ctx.lineTo(cx + fw / 2 - 16, yy + 6); } ctx.stroke(); ctx.lineCap = 'butt';
    if (n.cil) drawLeaves(cx, cy, n.leaves.slice(0, 6), 0.25);
    if (n.stage === 'folded') {
      ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5;
      for (let k = 1; k <= 4; k++) { if (n.cuts.length >= k) continue; const yy = cy - fh / 2 + fh * k / 5; ctx.beginPath(); ctx.moveTo(cx - fw / 2 - 30, yy); ctx.lineTo(cx + fw / 2 + 30, yy); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  // 焦了 / 快焦了：盖一层焦黑
  const flat = n.stage === 'raw' || n.stage === 'flipped' || n.stage === 'egg' || n.stage === 'eggdown';
  const shape = () => flat ? rr(cx - NW / 2 - 6, cy - NH / 2 - 5, NW + 12, NH + 10, 14) : rr(cx - (84 + (NW - 84) * n.fold) / 2 - 4, cy - NH / 2 - 3, 84 + (NW - 84) * n.fold + 8, NH + 6, 8);
  if (n.burnt && n.stage !== 'raw') {
    shape(); ctx.fillStyle = 'rgba(38,22,14,.82)'; ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    for (let k = 0; k < 9; k++) { ctx.beginPath(); ctx.ellipse(cx + ((k * 47) % 140) - 70 * (flat ? 1 : 0.4), cy + ((k * 31) % 110) - 55, 9, 6, k, 0, 7); ctx.fill(); }
  } else if (!n.burnt && n.stage !== 'raw' && n.heat > LIMIT[n.stage] - 4) {
    shape(); ctx.strokeStyle = `rgba(60,25,10,${0.55 + 0.25 * Math.sin(clock * 10)})`; ctx.lineWidth = 9; ctx.stroke();
  }
  ctx.restore();
}

// 返回 [提示文字, 级别]  级别: '' 普通, 'hot' 该操作了, 'burn' 焦了/要焦了
function hint(n) {
  if (!n) return ['拿「冷面」放这里', ''];
  if (n.burnt && n.stage === 'cut') return ['焦了！扔掉重做（硬给客人不给钱）', 'burn'];
  if (n.burnt) return ['烤焦了！点它拿起来，扔进垃圾桶', 'burn'];
  if (n.stage !== 'raw' && n.heat > LIMIT[n.stage] - 4) {
    const urge = { flipped: '快打鸡蛋', egg: '快拿铲子翻面', eggdown: '快刷酱撒香菜、折起来', folded: '快切开', cut: '快装碗' };
    return ['要焦了！' + urge[n.stage] + '！', 'burn'];
  }
  switch (n.stage) {
    case 'raw': {
      const s = step('noodle', n.t);
      if (s === 3) return ['烤焦了！点它拿起来，扔进垃圾桶', 'burn'];
      if (!n.vinegar) return ['① 加醋', ''];
      if (s < 2) return ['① 等冷面变成深色…', ''];
      if (nearBurn('noodle', n.t)) return ['要焦了！快拿铲子翻面！', 'burn'];
      return ['② 变深色了！拿铲子翻面', 'hot'];
    }
    case 'flipped': return ['③ 打鸡蛋', ''];
    case 'egg': return n.eggT < READY.egg ? ['③ 等鸡蛋凝固…', ''] : ['④ 蛋熟了！铲子翻面压蛋', 'hot'];
    case 'eggdown':
      if (!n.sauce) return ['④ 刷酱', ''];
      if (!n.cil) return LEVELS[S.level].noCil ? ['④ 撒香菜（客人不要就跳过，直接折）', ''] : ['④ 撒香菜', ''];
      return LEVELS[S.level].meat.length ? ['⑤ 放香肠/鱼排 → ⑥ 铲子折叠', ''] : ['⑥ 拿铲子两边折叠', ''];
    case 'folded': return [`⑦ 用铲子横划，从上往下切 (${n.cuts.length}/4)`, ''];
    case 'cut': return ['⑧ 拿纸碗装起来', 'hot'];
  }
}

function drawIcon(id, x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  switch (id) {
    case 'noodle': drawSheet(0, 0, 46, 32, rgb(COLORS.noodle[0])); break;
    case 'vinegar': drawBottle(0, 0, 0.8); break;
    case 'egg':
      ctx.beginPath(); ctx.ellipse(0, 2, 15, 19, 0, 0, Math.PI * 2); ctx.fillStyle = '#fff4dd'; ctx.fill();
      ctx.strokeStyle = '#c9b089'; ctx.lineWidth = 1.5; ctx.stroke(); break;
    case 'spatula': drawSpatula(0, 0, 0.55); break;
    case 'brush': drawBrush(0, 0, 0.9, 0); break;
    case 'cilantro':
      ctx.strokeStyle = '#3d7a32'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(0, -4); ctx.moveTo(0, 6); ctx.lineTo(-12, -8); ctx.moveTo(0, 6); ctx.lineTo(12, -8); ctx.stroke();
      drawLeaves(0, 0, [[0, -12, 0], [-14, -12, 1], [14, -12, 2], [-8, -20, 0.5], [8, -20, 2.4], [0, -4, 1.6]]); break;
    case 'sausage': drawSausage(0, 0, 50, 18, rgb(COLORS.sausage[2])); break;
    case 'fish': drawFish(0, 0, 44, 28, rgb(COLORS.fish[2])); break;
    case 'bowl': drawPaperBowl(0, 4, 0.7); break;
    case 'trash': drawTrash(0, 0, 0.6); break;
  }
  ctx.restore();
}

// ===================== 绘制：物件 =====================
function drawBottle(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(2, 33, 16, 4, 0, 0, 7); ctx.fill();
  const g = ctx.createLinearGradient(-14, 0, 14, 0); g.addColorStop(0, '#2a160c'); g.addColorStop(0.35, '#5a321c'); g.addColorStop(1, '#24120a');
  ctx.fillStyle = g; rr(-14, -10, 28, 42, 7); ctx.fill(); ctx.fillRect(-5, -30, 10, 22);
  ctx.strokeStyle = OL; ctx.lineWidth = 1.5; rr(-14, -10, 28, 42, 7); ctx.stroke();
  ctx.fillStyle = '#d33'; rr(-6, -37, 12, 8, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-10, -6, 3, 32);
  ctx.fillStyle = '#f7e6c4'; rr(-11, 2, 22, 18, 3); ctx.fill(); text('醋', 0, 11, 13, '#7a1f12');
  ctx.restore();
}
function drawSpatula(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  let g = ctx.createLinearGradient(-6, 0, 6, 0); g.addColorStop(0, '#4a2c18'); g.addColorStop(0.5, '#8a5a34'); g.addColorStop(1, '#4a2c18');
  ctx.fillStyle = g; rr(-7, 10, 14, 62, 6); ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.arc(0, 62, 3, 0, 7); ctx.fill();
  ctx.fillStyle = '#9aa1ab'; ctx.fillRect(-3, -6, 6, 18);
  g = ctx.createLinearGradient(-30, 0, 30, 0); g.addColorStop(0, '#aeb5bf'); g.addColorStop(0.3, '#eef1f5'); g.addColorStop(1, '#9aa2ad');
  rr(-30, -62, 60, 58, 5); ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#6c737e'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function drawBrush(x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = '#b07a42'; rr(-3.5, -32, 7, 34, 3); ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#aab'; ctx.fillRect(-8, 0, 16, 6);
  rr(-9, 6, 18, 15, 3); ctx.fillStyle = '#7a3416'; ctx.fill();
  ctx.restore();
}
function drawTrash(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0, 42, 30, 6, 0, 0, 7); ctx.fill();
  const g = ctx.createLinearGradient(-26, 0, 26, 0); g.addColorStop(0, '#3f7a50'); g.addColorStop(0.4, '#5fa874'); g.addColorStop(1, '#356a44');
  ctx.beginPath(); ctx.moveTo(-26, -22); ctx.lineTo(26, -22); ctx.lineTo(22, 40); ctx.lineTo(-22, 40); ctx.closePath();
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#2f5e3d'; rr(-32, -34, 64, 12, 5); ctx.fill(); ctx.stroke(); rr(-9, -41, 18, 8, 3); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 3; for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 12, -12); ctx.lineTo(k * 10, 32); ctx.stroke(); }
  ctx.restore();
}
function drawPaperBowl(x, y, s, b) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (b) {
    for (let k = 0; k < 5; k++) {
      const px = -26 + (k % 3) * 22 + (k > 2 ? 11 : 0), py = -16 - (k > 2 ? 10 : 0);
      rr(px - 12, py - 9, 24, 18, 5); ctx.fillStyle = '#f2c94c'; ctx.fill();
      rr(px - 10, py - 9, 20, 15, 5); ctx.fillStyle = b.burnt ? '#3a261b' : rgb(COLORS.noodle[2]); ctx.fill();
      ctx.strokeStyle = 'rgba(122,52,22,.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px - 7, py - 3); ctx.lineTo(px + 7, py - 5); ctx.stroke();
    }
    if (b.cil !== false) drawLeaves(0, -26, [[-14, 0, 0], [6, -4, 1], [18, 2, 2]]);
  }
  ctx.beginPath(); ctx.moveTo(-40, -12); ctx.lineTo(40, -12); ctx.lineTo(30, 26); ctx.lineTo(-30, 26); ctx.closePath();
  const g = ctx.createLinearGradient(-40, 0, 40, 0); g.addColorStop(0, '#efe6d6'); g.addColorStop(0.35, '#fffdf8'); g.addColorStop(1, '#e2d7c4');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#a8977c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#d9473a'; ctx.beginPath(); ctx.moveTo(-37, -2); ctx.lineTo(37, -2); ctx.lineTo(35, 6); ctx.lineTo(-35, 6); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#f7c948'; for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.arc(k * 14, 2, 1.8, 0, 7); ctx.fill(); }
  ctx.restore();
}
function plate(cx, cy, w) {
  ctx.beginPath(); ctx.ellipse(cx + 2, cy + 4, w / 2, w * 0.2, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, w * 0.2, 0, 0, 7); ctx.fillStyle = '#f8fafc'; ctx.fill();
  ctx.strokeStyle = '#9fa9b4'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 10, w * 0.2 - 5, 0, 0, 7); ctx.strokeStyle = '#d5dbe2'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 3, w * 0.2 - 1.5, 0, 0.1 * Math.PI, 0.9 * Math.PI); ctx.strokeStyle = '#3f6fb5'; ctx.lineWidth = 2; ctx.stroke();
}
function ceramicBowl(cx, cy, w, fill, contents) {
  const rh = w * 0.18, bh = w * 0.42;
  ctx.beginPath(); ctx.ellipse(cx + 2, cy + bh * 0.95, w * 0.34, 6, 0, 0, 7); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, rh, 0, 0, 7); ctx.fillStyle = '#e9eef2'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 4, rh - 3, 0, 0, 7); ctx.fillStyle = fill; ctx.fill();
  if (contents) contents();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, bh, 0, 0, Math.PI); ctx.ellipse(cx, cy, w / 2, rh, 0, Math.PI, 0, true); ctx.closePath();
  const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0); g.addColorStop(0, '#dde4ea'); g.addColorStop(0.35, '#ffffff'); g.addColorStop(1, '#c9d2db');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#8d98a5'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, w / 2 - 2, bh * 0.55, 0, 0.12 * Math.PI, 0.88 * Math.PI); ctx.strokeStyle = '#3f6fb5'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, w / 2 - 2, bh * 0.72, 0, 0.18 * Math.PI, 0.82 * Math.PI); ctx.strokeStyle = 'rgba(63,111,181,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
}

function drawStation(st) {
  const cx = st.x + st.w / 2, sel = S.tool === st.id && !S.held, en = stationEnabled(st.id);
  const hover = S.mode === 'play' && !S.paused && inR(mouse, st);
  if (sel || hover) {
    rr(st.x, st.y, st.w, st.h, 12); ctx.fillStyle = sel ? 'rgba(255,214,90,.4)' : 'rgba(255,255,255,.16)'; ctx.fill();
    if (sel) { ctx.strokeStyle = '#ffd65a'; ctx.lineWidth = 2.5; ctx.stroke(); }
  }
  const by = st.y + 46;
  ctx.save(); if (!en) ctx.globalAlpha = 0.35;
  switch (st.id) {
    case 'noodle':
      plate(cx, by + 10, 96);
      for (let k = 0; k < 3; k++) { rr(cx - 34 + k * 2, by - 6 - k * 6, 64, 22, 4); ctx.fillStyle = rgb(COLORS.noodle[0]); ctx.fill(); ctx.strokeStyle = '#bcae88'; ctx.lineWidth = 1; ctx.stroke(); }
      break;
    case 'vinegar': drawBottle(cx, by - 2, 1); break;
    case 'egg':
      ceramicBowl(cx, by - 4, 92, '#d9cdb5', () => {
        [[-18, -6], [4, -9], [22, -4], [-6, 0]].forEach(([ex, ey]) => { ctx.beginPath(); ctx.ellipse(cx + ex, by - 4 + ey, 11, 14, 0, 0, 7); ctx.fillStyle = '#fff4dd'; ctx.fill(); ctx.strokeStyle = '#c9b089'; ctx.lineWidth = 1; ctx.stroke(); });
      });
      break;
    case 'brush':
      ceramicBowl(cx, by - 4, 92, '#6e2c10', () => { ctx.beginPath(); ctx.ellipse(cx - 10, by - 7, 14, 4, 0, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill(); });
      if (!sel) drawBrush(cx + 18, by - 22, 1.1, 0.6);
      break;
    case 'cilantro':

      break;

}

function bubblePath(bx, by, bw, bh, r, tx) {
  ctx.beginPath(); ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by); ctx.arcTo(bx + bw, by, bx + bw, by + r, r);
  ctx.lineTo(bx + bw, by + bh - r); ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(tx + 9, by + bh); ctx.lineTo(tx + 2, by + bh + 10); ctx.lineTo(tx - 7, by + bh);
  ctx.lineTo(bx + r, by + bh); ctx.arcTo(bx, by + bh, bx, by + bh - r, r); ctx.lineTo(bx, by + r); ctx.arcTo(bx, by, bx + r, by, r); ctx.closePath();
}

for (const k in ANIM_IMG) {
  const A = ANIM_IMG[k]; A.img = new Image(); A.face = ['#fff', '#fff'];

  A.img.onload = () => { try {
    const c = document.createElement('canvas'); c.width = A.img.naturalWidth; c.height = A.img.naturalHeight;
    const g = c.getContext('2d'); g.drawImage(A.img, 0, 0);
    A.face = A.eyes.map(([ex, ey]) => {
      const cols = [];
      for (const [dx, dy] of [[0, -17], [-13, -12], [13, -12], [-15, 0], [15, 0]]) {
        const p = g.getImageData(Math.round(ex + dx), Math.round(ey + dy), 1, 1).data;
        if (p[3] > 200 && (p[0] + p[1] + p[2]) / 3 > 140) cols.push(p);
      }
      if (!cols.length) return '#fff';
      cols.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
      const m = cols[cols.length >> 1]; return `rgb(${m[0]},${m[1]},${m[2]})`;
    });
  } catch (_) {} };
  A.img.src = A.src;
}
function drawAnimal(c, x, hy, mood) {
  const A = ANIM_IMG[c.kind]; if (!A || !A.img.complete || !A.img.naturalWidth) return;
  const k = ANIM_H / ANIM_SRC_H, w = A.img.naturalWidth * k, top = hy - 58;
  const shake = mood === 'angry' && c.state === 'wait' ? Math.sin(clock * 40) * 1.6 : 0;
  const left = x - w / 2 + shake;
  ctx.drawImage(A.img, left, top, w, ANIM_H);
  const leavingHappy = c.state === 'leave' && mood === 'happy';
  const blink = (c.blinkT % 4) < 0.14;
  const eyeMode = mood === 'angry' ? 'angry' : leavingHappy ? 'happy' : blink ? 'blink' : null;
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (eyeMode) A.eyes.forEach(([ex, ey], i) => {
    const px = left + ex * k, py = top + ey * k, s = i === 0 ? -1 : 1;
    ctx.beginPath(); ctx.ellipse(px, py, 6.2, 7, 0, 0, 7); ctx.fillStyle = A.face[i]; ctx.fill();
    ctx.strokeStyle = '#4a3226'; ctx.lineWidth = 2.6; ctx.beginPath();
    if (eyeMode === 'angry') { ctx.moveTo(px + s * 4, py - 4.5); ctx.lineTo(px - s * 3.5, py); ctx.lineTo(px + s * 4, py + 4.5); }      // > <
    else if (eyeMode === 'happy') { ctx.moveTo(px - 4.5, py + 2); ctx.quadraticCurveTo(px, py - 6, px + 4.5, py + 2); }         // ^ ^
    else { ctx.moveTo(px - 4.5, py); ctx.quadraticCurveTo(px, py + 3.5, px + 4.5, py); }                                        // 眨眼
    ctx.stroke();
  });
  if (mood === 'angry') { // 生气符号
    ctx.save(); ctx.translate(left + w * 0.8, top + 22 + Math.sin(clock * 10) * 1.5); ctx.strokeStyle = '#e8352a'; ctx.lineWidth = 3.2;
    for (let r = 0; r < 4; r++) { ctx.beginPath(); ctx.moveTo(3, -10); ctx.quadraticCurveTo(3, -3, 10, -3); ctx.stroke(); ctx.rotate(Math.PI / 2); }
    ctx.restore();

    const sx = left + w * 0.82, sy = top + 46 + (clock * 14 % 8);
    ctx.beginPath(); ctx.moveTo(sx, sy - 10); ctx.quadraticCurveTo(sx + 7, sy, sx, sy + 5); ctx.quadraticCurveTo(sx - 7, sy, sx, sy - 10);
    ctx.fillStyle = '#9fd4ff'; ctx.fill(); ctx.strokeStyle = '#4a86b8'; ctx.lineWidth = 1.8; ctx.stroke();
  }
  if (leavingHappy) { // 开心地冒小爱心
    for (let i = 0; i < 2; i++) {
      const t = (clock * 0.9 + i * 0.5) % 1;
      ctx.globalAlpha = 1 - t; heartShape(left + w * (i ? 0.85 : 0.15), top + 20 - t * 26, 9); ctx.fillStyle = '#ff7f96'; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

}

function bubbleSide(bx, by, bw, bh, r, side) {
  ctx.beginPath(); ctx.moveTo(bx + r, by); ctx.lineTo(bx + bw - r, by); ctx.arcTo(bx + bw, by, bx + bw, by + r, r);

  ctx.lineTo(bx + bw, by + bh - r); ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r, by + bh); ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
  if (side > 0) { ctx.lineTo(bx, by + bh - 12); ctx.lineTo(bx - 13, by + bh - 6); ctx.lineTo(bx, by + bh - 26); }

const UI = {};
for (const k in UI_SRC) { UI[k] = new Image(); UI[k].src = UI_SRC[k]; }
const uiReady = k => UI[k] && UI[k].complete && UI[k].naturalWidth > 0;
// 画一张图片按钮：鼠标移上去会稍微放大；hit 是可点击区域（相对图片的比例）
function imgButton(k, cx, top, w, fn, hit = [0, 0, 1, 1]) {
  const img = UI[k], h = w * img.naturalHeight / img.naturalWidth, x = cx - w / 2;
  const r = { x: x + w * hit[0], y: top + h * hit[1], w: w * (hit[2] - hit[0]), h: h * (hit[3] - hit[1]) };
  const hov = inR(mouse, r), k2 = hov ? 1.05 : 1;
  ctx.drawImage(img, cx - w * k2 / 2, top + h / 2 - h * k2 / 2 - (hov ? 3 : 0), w * k2, h * k2);
  buttons.push({ ...r, fn });
}

// ===================== 页面 / 弹窗 =====================
function button(label, x, y, w, h, fn, kind = 'primary') {
  const hov = inR(mouse, { x, y, w, h });
  const base = kind === 'primary' ? '#ffcf3f' : '#fff1dc';
  rr(x, y + 5, w, h, h / 2.6); ctx.fillStyle = kind === 'primary' ? '#b5741a' : '#b59a78'; ctx.fill();
  const dy = hov ? -2 : 0;
  rr(x, y + dy, w, h, h / 2.6);
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, shade(base, hov ? 0.35 : 0.2)); g.addColorStop(1, base);
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.stroke();
  text(label, x + w / 2, y + h / 2 + dy + 1, Math.min(26, h * 0.42), '#4a2410', 'center', 'normal', null, TFONT);
  buttons.push({ x, y, w, h, fn });
}
function panel(x, y, w, h, dim = true) {
  if (dim) { ctx.fillStyle = 'rgba(25,12,20,.6)'; ctx.fillRect(0, 0, W, H); }
  rr(x + 4, y + 8, w, h, 22); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();
  rr(x, y, w, h, 22); const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#f6e6c8');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.stroke();
  rr(x + 8, y + 8, w - 16, h - 16, 16); ctx.strokeStyle = 'rgba(200,120,60,.45)'; ctx.lineWidth = 2; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
}
function steam(x, y, n, h) {
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  for (let k = 0; k < n; k++) {
    const sx = x + (k - (n - 1) / 2) * 26, ph = clock * 2 + k * 1.7;
    ctx.globalAlpha = 0.4 + 0.3 * Math.sin(ph);
    ctx.beginPath(); for (let t = 0; t <= 1; t += 0.1) { const yy = y - t * h, xx = sx + Math.sin(t * 6 + ph) * 7; t ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}

function drawHome() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(20,10,25,.25)'); g.addColorStop(0.5, 'rgba(20,10,25,.6)'); g.addColorStop(1, 'rgba(20,10,25,.8)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const ready = ['title', 'start', 'levels', 'help'].every(uiReady);
  if (!ready) { // 图片还没加载好时的备用画法
    text('烤冷面小摊', W / 2, 230, 78, '#ffe27a', 'center', 'normal', '#5a1408', TFONT);
    button('开始游戏', W / 2 - 130, 516, 260, 64, () => startLevel(0));
    button('选择关卡', W / 2 - 215, 600, 200, 52, () => { S = { mode: 'levels', level: 0 }; }, 'secondary');
    button('游戏说明', W / 2 + 15, 600, 200, 52, () => { S = { mode: 'help', level: 0 }; }, 'secondary');
    return;
  }
  // 招牌（轻轻上下浮动）
  const tw = 660, th = tw * UI.title.naturalHeight / UI.title.naturalWidth;
  ctx.drawImage(UI.title, W / 2 - tw / 2, 78 + Math.sin(clock * 1.5) * 4, tw, th);
  imgButton('start', W / 2, 392, 330, () => startLevel(0), [0.12, 0.2, 0.88, 0.95]);
  imgButton('levels', W / 2 - 128, 532, 240, () => { S = { mode: 'levels', level: 0 }; }, [0.05, 0.15, 0.95, 0.95]);
  imgButton('help', W / 2 + 128, 532, 240, () => { S = { mode: 'help', level: 0 }; }, [0.05, 0.15, 0.95, 0.95]);
}

function drawLevels() {
  panel(60, 80, 980, 560);
  text('选择关卡', W / 2, 135, 40, '#c0392b', 'center', 'normal', null, TFONT);
  const cw = 170, gap = 16, x0 = (W - (5 * cw + 4 * gap)) / 2, y0 = 190, ch = 310;
  const tops = ['#ffe9a8', '#ffd6b0', '#ffc9c0', '#e4d4ff', '#c9e3ff'];
  LEVELS.forEach((L, i) => {
    const x = x0 + i * (cw + gap), hov = inR(mouse, { x, y: y0, w: cw, h: ch }), y = y0 - (hov ? 5 : 0);
    rr(x + 3, y0 + 7, cw, ch, 20); ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fill();
    rr(x, y, cw, ch, 20);
    const g = ctx.createLinearGradient(0, y, 0, y + ch); g.addColorStop(0, tops[i]); g.addColorStop(1, '#fffaf0');
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hov ? '#e8613a' : OL; ctx.lineWidth = hov ? 3.5 : 2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(x + cw / 2, y + 52, 30, 0, 7); ctx.fillStyle = '#e8613a'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.stroke();
    text(String(i + 1), x + cw / 2, y + 54, 32, '#fff', 'center', 'normal', null, TFONT);
    text(L.name, x + cw / 2, y + 112, 22, '#4a2410', 'center', 'normal', null, TFONT);
    text(L.desc, x + cw / 2, y + 144, 14, '#7a5a3a', 'center', 'normal');
    const items = ['noodle'].concat(L.meat);
    const ix0 = x + cw / 2 - (items.length - 1) * 19 - (L.noCil ? 19 : 0);
    items.forEach((id, k) => drawIcon(id, ix0 + k * 38, y + 190, 0.55));
    if (L.noCil) {
      const cx = ix0 + items.length * 38; drawIcon('cilantro', cx, y + 190, 0.55);
      ctx.strokeStyle = '#e8352a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx - 10, y + 180); ctx.lineTo(cx + 10, y + 200); ctx.moveTo(cx + 10, y + 180); ctx.lineTo(cx - 10, y + 200); ctx.stroke();
    }
    text('目标 ¥' + L.target, x + cw / 2, y + 240, 18, '#c0392b');
    text(`时间 ${Math.floor(L.time / 60)}:${String(L.time % 60).padStart(2, '0')}`, x + cw / 2, y + 270, 14, '#7a5a3a', 'center', 'normal');
    buttons.push({ x, y: y0, w: cw, h: ch, fn: () => startLevel(i) });
  });
  button('返回首页', W / 2 - 110, 560, 220, 52, goHome, 'secondary');
}

// ---------- 游戏说明：带图的步骤 ----------
function arrow(x1, y1, x2, y2, curve = 0, col = '#ff7a2a') {
  const mx = (x1 + x2) / 2 - (y2 - y1) * curve, my = (y1 + y2) / 2 + (x2 - x1) * curve;
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(mx, my, x2, y2); ctx.stroke(); ctx.lineCap = 'butt';
  const a = Math.atan2(y2 - my, x2 - mx);
  ctx.beginPath(); ctx.moveTo(x2 + Math.cos(a) * 5, y2 + Math.sin(a) * 5);
  ctx.lineTo(x2 - Math.cos(a - 0.55) * 13, y2 - Math.sin(a - 0.55) * 13);
  ctx.lineTo(x2 - Math.cos(a + 0.55) * 13, y2 - Math.sin(a + 0.55) * 13); ctx.closePath(); ctx.fill();
}

function helpCard(k, x, y, w, h) {
  const st = HELP_STEPS[k];

  rr(x, y, w, h, 16); ctx.fillStyle = '#fffdf6'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();
  const px = x + 10, py = y + 10, pw = w - 20, ph = 150;
  ctx.save(); rr(px, py, pw, ph, 12); ctx.clip();
  const g = ctx.createLinearGradient(px, py, px + pw, py + ph);
  if (st.bg === 'wall') { g.addColorStop(0, '#5b3b6e'); g.addColorStop(1, '#f2905e'); }
  else { g.addColorStop(0, '#6b7079'); g.addColorStop(1, '#33363c'); }
  ctx.fillStyle = g; ctx.fillRect(px, py, pw, ph);
  if (st.bg === 'wall') { ctx.fillStyle = '#b77a44'; ctx.fillRect(px, py + ph - 26, pw, 26); }
  ctx.translate(px + pw / 2, py + ph / 2); st.draw();
  ctx.restore();
  rr(px, py, pw, ph, 12); ctx.strokeStyle = 'rgba(60,30,10,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 24, y + 24, 16, 0, 7); ctx.fillStyle = '#e8613a'; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();

}

// ===================== 主循环 =====================
// 色彩分级：把颜色压成有限的几档（像老游戏机的调色板），渐变变成一格一格的色带
const POST = new Uint8Array(256);
for (let v = 0; v < 256; v++) POST[v] = Math.min(255, Math.round(Math.round(v / 255 * 11) / 11 * 255));
function posterize() {
  const img = LOC.getImageData(0, 0, LO.width, LO.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = POST[d[i]]; d[i + 1] = POST[d[i + 1]]; d[i + 2] = POST[d[i + 2]]; d[i + 3] = d[i + 3] < 110 ? 0 : 255; }
  LOC.putImageData(img, 0, 0);
}
// 画一层：像素模式下先画到小画布再放大
function layer(fn, post = false) {
  if (!PIXEL) { ctx = MAIN; MAIN.setTransform(DPR, 0, 0, DPR, 0, 0); fn(); return; }
  LOC.setTransform(1, 0, 0, 1, 0, 0); LOC.clearRect(0, 0, LO.width, LO.height);
  TXC.setTransform(1, 0, 0, 1, 0, 0); TXC.clearRect(0, 0, W, H);
  LOC.setTransform(PS, 0, 0, PS, 0, 0); LOC.globalAlpha = 1;
  ctx = LOC; fn(); ctx = MAIN;
  LOC.setTransform(1, 0, 0, 1, 0, 0);
  if (post) posterize();
  MAIN.setTransform(1, 0, 0, 1, 0, 0); MAIN.globalAlpha = 1; MAIN.imageSmoothingEnabled = false;
  MAIN.drawImage(LO, 0, 0, cv.width, cv.height);
  MAIN.drawImage(TX, 0, 0, cv.width, cv.height);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  MAIN.setTransform(1, 0, 0, 1, 0, 0);
  MAIN.clearRect(0, 0, cv.width, cv.height);
  const menu = S.mode === 'home' || S.mode === 'help' || S.mode === 'levels';
  layer(() => {
    drawBackdrop();
    drawAwning();
    if (S.cust) { for (const c of S.cust) if (c) drawCustomer(c); }
    else if (S.mode === 'home') HOME_CUST.forEach((c, i) => { c.x = CSLOTS[i]; c.state = 'home'; drawAnimal(c, c.x, 158, 'happy'); });
    drawStall();
    if (S.cust) { for (const c of S.cust) if (c && c.state === 'wait') drawPaws(c); }
    else if (S.mode === 'home') HOME_CUST.forEach(drawPaws);
  }, true);
  if (!menu) { layer(() => { drawHUD(); drawFloats(); }); layer(drawCursor); }
  layer(() => {
    drawOverlay();
    if (menu) smallBtn(SOUND_MENU, AU.muted ? '🔇 静音' : '🔊 声音', AU.muted ? '#c9b8a8' : '#9fd8ff');
  });
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
